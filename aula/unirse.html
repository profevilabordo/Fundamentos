<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aula | Mi seguimiento</title>
  <link rel="stylesheet" href="../styles.css">

  <style>
    .wrap {
      max-width: 720px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
    }
    .row {
      margin: 12px 0;
    }
    .label {
      font-weight: 600;
      margin-bottom: 4px;
      display: block;
    }
    .progress {
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      height: 22px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      width: 0%;
      color: white;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width .3s ease;
    }
    button {
      padding: 12px 18px;
      border-radius: 12px;
      border: 0;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    .primary {
      background: #2563eb;
      color: white;
    }
    .danger {
      background: #fee2e2;
      color: #991b1b;
    }
    .msg {
      margin-top: 12px;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <a class="back-button" href="../index.html">← Volver al inicio</a>

    <div class="card">
      <h1>📊 Mi seguimiento</h1>
      <p style="opacity:.75">
        Acá ves tu progreso general en la asignatura.
      </p>

      <div class="row">
        <span class="label">Alumno</span>
        <div id="email"></div>
      </div>

      <div class="row">
        <span class="label">Progreso general</span>
        <div class="progress">
          <div id="progressFill" class="progress-fill">0%</div>
        </div>
      </div>

      <button id="btnLogout" class="danger">Cerrar sesión</button>

      <div id="msg" class="msg"></div>
    </div>
  </div>

  <!-- SUPABASE SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* ===============================
       CONFIGURACIÓN SUPABASE
       =============================== */
      const SUPABASE_URL = "https://qixsvvahwcycfyptvdxr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpeHN2dmFod2N5Y2Z5cHR2ZHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNTMxNzAsImV4cCI6MjA4NTYyOTE3MH0.MKJPJIspJzLMJ8TCSZQr3RLKwFum9HUUHfBKeNW0qb4"; // anon public legacy


    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = (id) => document.getElementById(id);
    const setMsg = (t) => $("msg").textContent = t;

    /* ===============================
       OBTENER USUARIO LOGUEADO
       =============================== */
    async function init() {
      const { data, error } = await supabaseClient.auth.getUser();

      if (error || !data.user) {
        setMsg("⚠️ No hay sesión activa. Volvé a ingresar.");
        setTimeout(() => {
          window.location.href = "./login.html";
        }, 1500);
        return;
      }

      const user = data.user;
      $("email").textContent = user.email;

      // Progreso DEMO (después lo conectamos a la BD)
      const progreso = 40; // %
      const fill = $("progressFill");
      fill.style.width = progreso + "%";
      fill.textContent = progreso + "%";
    }

    init();

    /* ===============================
       LOGOUT
       =============================== */
    $("btnLogout").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      window.location.href = "./login.html";
    });
  </script>
</body>
</html>
