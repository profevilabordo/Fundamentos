<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Aula | Ingresar</title>
  <!-- VERSION: LOGIN LIMPIO 2026-02-02 -->

  <link rel="stylesheet" href="../styles.css">
  <style>
    .wrap {
      max-width: 520px;
      margin: 40px auto;
      padding: 0 16px;
    }
    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 10px 24px rgba(0,0,0,.08);
    }
    input {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid #dbe3f0;
      margin: 8px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 0;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
    }
    .primary {
      background: #2563eb;
      color: white;
    }
    .muted {
      background: #eef2ff;
      color: #1e3a8a;
    }
    .msg {
      margin-top: 12px;
      font-size: 14px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <a class="back-button" href="../index.html">← Volver al inicio</a>

    <div class="card">
      <h1>🔐 Aula – Ingresar</h1>
      <p style="opacity:.75">
        Registrate o ingresá para guardar tu progreso.
      </p>

      <label>Email</label>
      <input id="email" type="email" placeholder="alumno@test.com" />

      <label>Contraseña</label>
      <input id="password" type="password" placeholder="mínimo 6 caracteres" />

      <button id="btnSignup" class="muted">Crear cuenta</button>
      <button id="btnLogin" class="primary">Entrar</button>

      <div id="msg" class="msg"></div>
    </div>
  </div>

  <!-- SUPABASE SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    /* ===============================
       CONFIGURACIÓN SUPABASE
       =============================== */
      const SUPABASE_URL = "https://qixsvvahwcycfyptvdxr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFpeHN2dmFod2N5Y2Z5cHR2ZHhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzAwNTMxNzAsImV4cCI6MjA4NTYyOTE3MH0.MKJPJIspJzLMJ8TCSZQr3RLKwFum9HUUHfBKeNW0qb4"; // anon public legacy


    /* ===============================
       INIT
       =============================== */
    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );

    const $ = (id) => document.getElementById(id);
    const setMsg = (t) => $("msg").textContent = t;

    /* ===============================
       CREAR CUENTA
       =============================== */
    $("btnSignup").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value.trim();

      if (!email) return setMsg("⚠️ Escribí un email.");
      if (!password || password.length < 6)
        return setMsg("⚠️ Contraseña mínima: 6 caracteres.");

      setMsg("Creando cuenta...");

     const { data, error } = await supabaseClient.auth.signUp({
  email,
  password
});


      console.log("SIGNUP data:", data);
      console.log("SIGNUP error:", error);

      if (error) {
        setMsg("❌ " + error.message);
        alert(error.message);
        return;
      }

      setMsg("✅ Cuenta creada. Ahora tocá «Entrar».");
      alert("Cuenta creada correctamente ✅");
    });

    /* ===============================
       LOGIN
       =============================== */
    $("btnLogin").addEventListener("click", async () => {
      const email = $("email").value.trim();
      const password = $("password").value.trim();

      if (!email || !password)
        return setMsg("⚠️ Completá email y contraseña.");

      setMsg("Ingresando...");

    const { data, error } = await supabaseClient.auth.signInWithPassword({
  email,
  password
});


      console.log("LOGIN data:", data);
      console.log("LOGIN error:", error);

      if (error) {
        setMsg("❌ " + error.message);
        alert(error.message);
        return;
      }

      setMsg("✅ Ingreso correcto. Redirigiendo...");
      window.location.href = "./unirse.html";
    });
  </script>
</body>
</html>
