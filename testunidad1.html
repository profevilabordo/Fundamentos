<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Unidad 1: Organizaciones</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            color: #667eea;
            text-align: center;
        }
        .question {
            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }
        .question h3 {
            color: #333;
            margin-top: 0;
        }
        .options {
            margin: 15px 0;
        }
        .option {
            margin: 10px 0;
            padding: 12px;
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .option:hover {
            border-color: #667eea;
            transform: translateX(5px);
        }
        .option input {
            margin-right: 10px;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 25px;
            cursor: pointer;
            display: block;
            margin: 30px auto;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }
        #result {
            margin-top: 30px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
        }
        .correct { color: #28a745; }
        .incorrect { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Quiz - Unidad 1: Organizaciones</h1>
        <p style="text-align: center; color: #666;">Respondé las 20 preguntas y obtené tu resultado al final</p>
        
        <form id="quizForm">
            <!-- Pregunta 1 -->
            <div class="question">
                <h3>1. ¿Cuál es la definición correcta de organización?</h3>
                <div class="options">
                    <label class="option">
                        <input type="radio" name="q1" value="a">
                        A) Un grupo de personas que trabajan en el mismo lugar
                    </label>
                    <label class="option">
                        <input type="radio" name="q1" value="b">
                        B) Un conjunto de personas que se coordinan de manera ordenada para alcanzar objetivos comunes
                    </label>
                    <label class="option">
                        <input type="radio" name="q1" value="c">
                        C) Una empresa que busca obtener ganancias económicas
                    </label>
                    <label class="option">
                        <input type="radio" name="q1" value="d">
                        D) Un lugar físico donde se realizan actividades comerciales
                    </label>
                </div>
            </div>

            <!-- Pregunta 2 -->
            <div class="question">
                <h3>2. ¿Cuántos elementos básicos tiene toda organización?</h3>
                <div class="options">
                    <label class="option">
                        <input type="radio" name="q2" value="a">
                        A) 4 elementos
                    </label>
                    <label class="option">
                        <input type="radio" name="q2" value="b">
                        B) 5 elementos
                    </label>
                    <label class="option">
                        <input type="radio" name="q2" value="c">
                        C) 6 elementos
                    </label>
                    <label class="option">
                        <input type="radio" name="q2" value="d">
                        D) 8 elementos
                    </label>
                </div>
            </div>

            <!-- Agrega las otras 18 preguntas siguiendo el mismo formato -->
            
            <button type="button" onclick="checkAnswers()">Ver Resultados 📊</button>
        </form>

        <div id="result"></div>
    </div>

    <script>
        const correctAnswers = {
            q1: 'b',
            q2: 'c',
            // ... agregar todas las respuestas correctas
        };

        function checkAnswers() {
            let score = 0;
            const form = document.getElementById('quizForm');
            const formData = new FormData(form);
            
            for (let [question, answer] of Object.entries(correctAnswers)) {
                if (formData.get(question) === answer) {
                    score++;
                }
            }
            
            const total = Object.keys(correctAnswers).length;
            const percentage = (score / total) * 100;
            
            let message = '';
            let color = '';
            
            if (percentage >= 90) {
                message = '¡Excelente! 🌟 Dominás los conceptos';
                color = '#28a745';
            } else if (percentage >= 75) {
                message = 'Muy bien 👍 Repasá los errores';
                color = '#17a2b8';
            } else if (percentage >= 60) {
                message = 'Bien ✓ Necesitás repasar más';
                color = '#ffc107';
            } else {
                message = 'Necesitás estudiar más 📚';
                color = '#dc3545';
            }
            
            document.getElementById('result').innerHTML = `
                <div style="background: ${color}; color: white; padding: 20px; border-radius: 10px;">
                    <h2>${message}</h2>
                    <p style="font-size: 24px;">Obtuviste: ${score}/${total} (${percentage.toFixed(0)}%)</p>
                </div>
            `;
        }
    </script>
</body>
</html>
